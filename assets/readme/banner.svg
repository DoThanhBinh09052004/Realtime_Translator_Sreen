<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Translate HUD — Read the screen. Keep the flow.</title>
  <desc id="desc">Minh họa chuyển hội thoại tiếng Anh trên màn hình thành phụ đề tiếng Việt bằng OCR và dịch thuật.</desc>
  <rect width="1280" height="460" rx="20" fill="#0e0f12"/>
  <rect x=".5" y=".5" width="1279" height="459" rx="20" fill="none" stroke="#282a36"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="42" width="34" height="34" rx="9" fill="#22223d"/>
    <path d="M57 56v-5h6m10 5v-5h-6m-10 12v5h6m10-5v5h-6" stroke="#a5a7ff" stroke-width="2" fill="none"/>
    <text x="96" y="66" fill="#f4f4f7" font-size="20" font-weight="700">TRANSLATE HUD</text>
    <text x="48" y="155" fill="#f4f4f7" font-size="58" font-weight="700" letter-spacing="-2">Read the screen.</text>
    <text x="48" y="222" fill="#a5a7ff" font-size="58" font-weight="700" letter-spacing="-2">Keep the flow.</text>
    <text x="50" y="271" fill="#c5c8d8" font-size="18">Dịch chữ trên màn hình thành phụ đề nổi.</text>
    <text x="50" y="300" fill="#8c90a4" font-size="16">Chọn vùng. Nhận diện. Dịch. Đọc ngay trên game.</text>
    <g font-size="13" font-weight="600" fill="#c5c8d8">
      <rect x="48" y="348" width="96" height="32" rx="16" fill="#191a21" stroke="#323544"/>
      <text x="69" y="369">Windows</text>
      <rect x="154" y="348" width="112" height="32" rx="16" fill="#191a21" stroke="#323544"/>
      <text x="173" y="369">Screen OCR</text>
      <rect x="276" y="348" width="142" height="32" rx="16" fill="#191a21" stroke="#323544"/>
      <text x="295" y="369">Google / AI APIs</text>
    </g>
    <rect x="675" y="54" width="553" height="350" rx="16" fill="#14151a" stroke="#323544"/>
    <path d="M676 98h551" stroke="#282a36"/>
    <circle cx="698" cy="76" r="4" fill="#6366f1"/>
    <text x="712" y="81" fill="#c5c8d8" font-size="13">SCREEN → SUBTITLES</text>
    <text x="1199" y="81" fill="#8c90a4" font-size="11" text-anchor="end">EN / VI</text>
    <path d="M700 164l86-40 95 52 80-42 94 54 94-32 58 25v70H700z" fill="#1b1d2b"/>
    <path d="M700 199l115-42 105 53 85-40 103 42 99-35v74H700z" fill="#24273c"/>
    <rect x="718" y="204" width="468" height="60" rx="8" fill="#191a21"/>
    <rect x="711" y="197" width="482" height="74" rx="10" fill="none" stroke="#8183ff" stroke-dasharray="6 5"/>
    <text x="738" y="241" fill="#f4f4f7" font-size="18">There is a whole world waiting for us.</text>
    <rect x="1042" y="185" width="137" height="23" rx="6" fill="#6366f1"/>
    <text x="1054" y="201" fill="#ffffff" font-size="11" font-weight="600">VÙNG QUÉT OCR</text>
    <path d="M952 280v17m-5-5 5 5 5-5" stroke="#8c90a4" stroke-width="2" fill="none"/>
    <rect x="713" y="312" width="478" height="63" rx="10" fill="#0e0f12" stroke="#41435c"/>
    <rect x="713" y="326" width="3" height="34" rx="1.5" fill="#10b981"/>
    <text x="952" y="350" text-anchor="middle" fill="#f4f4f7" font-size="19" font-weight="600">Cả một thế giới đang chờ chúng ta.</text>
    <text x="50" y="424" fill="#8c90a4" font-size="11" letter-spacing="1.5">REALTIME SCREEN TRANSLATOR</text>
    <text x="1228" y="431" text-anchor="end" fill="#8c90a4" font-size="11">Minh họa luồng dịch · Không phải ảnh chụp game</text>
  </g>
</svg>
