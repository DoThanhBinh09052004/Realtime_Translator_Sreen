[pytest]
testpaths = tests
pythonpath = .
qt_api = pyqt5
# Run a group: python -m pytest -m capture
# Combine groups: python -m pytest -m "capture or translation"
markers =
    capture: screen/window capture, selection, and capture geometry
    ocr: text recognition, OCR settings, and performance
    translation: providers, translation queues, caching, and retries
    context: context building, memory, protocol, and lifecycle
    dialogue: dialogue tracking, sessions, coordination, and replay
    blocks: text blocks, grouping, layout, and block workers
    overlay: subtitles, translation presentation, and overlay rendering
    settings_security: configuration, credentials, and endpoint security
    language_packs: language registry and language pack lifecycle
    app_ui: application controllers, pages, controls, and shared test isolation
    packaging: application paths, bundles, and packaged runtime resources
